<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>লগইন | হিসাব-কিতাব</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                📊
            </div>

            <h1>হিসাব-কিতাব</h1>

            <p class="auth-subtitle">
                আপনার অ্যাকাউন্টে লগইন করুন
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">
                        ইমেইল
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="আপনার ইমেইল লিখুন"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        পাসওয়ার্ড
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="আপনার পাসওয়ার্ড লিখুন"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div
                    id="loginMessage"
                    class="auth-message"
                    style="display: none;"
                ></div>

                <button
                    type="submit"
                    class="auth-submit-btn"
                    id="loginBtn"
                >
                    লগইন করুন
                </button>

            </form>

            <div class="auth-footer">

                <span>
                    অ্যাকাউন্ট নেই?
                </span>

                <a href="register.html">
                    রেজিস্টার করুন
                </a>

            </div>

        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>
